<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senn Hub OS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap');

:root{
    --bg:#050816;
    --bg2:#0d1b4f;
    --cyan:#00e5ff;
    --white:#ffffff;
    --glass:rgba(255,255,255,.05);
    --border:rgba(255,255,255,.12);
    --shadow:0 0 25px rgba(0,229,255,.35);
}
    
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
    linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px),
    var(--bg);

    background-size:40px 40px;
    color:var(--white);
    overflow:hidden;
    animation:gridMove 18s linear infinite;
}

/* ==========================
   Boot Screen
========================== */

#boot{
    position:fixed;
    inset:0;
    background:#02040d;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
}

.logo{
    font-family:'Orbitron',sans-serif;
    font-size:55px;
    font-weight:bold;
    color:var(--cyan);
    text-shadow:
        0 0 15px var(--cyan),
        0 0 40px var(--cyan);
}

.version{
    margin-top:10px;
    color:#9cb3ff;
}

.loading{
    width:320px;
    height:10px;
    background:#111;
    margin-top:35px;
    border-radius:30px;
    overflow:hidden;
}

.bar{
    width:0%;
    height:100%;
    background:var(--cyan);
    box-shadow:0 0 25px var(--cyan);
    transition:.05s;
}

.status{
    margin-top:20px;
    color:#7ea4ff;
    font-size:14px;
}

/* ==========================
   Desktop
========================== */

#desktop{
    display:none;
    width:100%;
    height:100vh;
    background:
radial-gradient(circle at top,var(--bg2),var(--bg) 70%);
}

.topbar{

height:60px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(12px);

display:flex;

justify-content:space-between;

align-items:center;

padding:0 25px;

border-bottom:1px solid rgba(255,255,255,.1);

}

.brand{
    font-family:'Orbitron',sans-serif;
    font-size:22px;
    font-weight:bold;
    color:var(--cyan);
}

.clock{

font-size:18px;

color:var(--white);

}

.center{

height:calc(100vh - 60px);

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

}

.center h1{

font-size:65px;

color:var(--cyan);

text-shadow:0 0 20px var(--cyan);

}

.center p{

margin-top:15px;

font-size:18px;

color:#bbb;

}

.launch{

margin-top:40px;

padding:16px 35px;

border:none;

border-radius:15px;

background:var(--cyan);

color:#000;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.launch:hover{

transform:scale(1.08);

box-shadow:0 0 25px var(--cyan);
}
 @keyframes gridMove{
    from{
        background-position:0 0;
    }
    to{
        background-position:40px 40px;
    }
 }
</style>
</head>

<body>

<div id="boot">

<div class="logo">SENN HUB OS</div>

<div class="version">
Version 1.0 Developer Preview
</div>

<div class="loading">

<div class="bar"></div>

</div>

<div class="status" id="status">
Initializing...
</div>

</div>

<div id="desktop">

<div class="topbar">

<div class="brand">
Senn Hub OS
</div>

<div class="clock" id="clock">
00:00:00
</div>

</div>

<div class="center">

<div class="apps">

<div class="app">
📁
<span>Projects</span>
</div>

<div class="app">
💻
<span>Terminal</span>
</div>

<div class="app">
📊
<span>Dashboard</span>
</div>

<div class="app">
👤
<span>About</span>
</div>

<div class="app">
⚙️
<span>Settings</span>
</div>

<div class="app">
📞
<span>Contact</span>
</div>

</div>

</div>

</div>

<script>

const status=document.getElementById("status");

const boot=document.getElementById("boot");

const desktop=document.getElementById("desktop");

const bar=document.querySelector(".bar");

const text=[
"Loading Kernel...",
"Loading Security...",
"Loading Network...",
"Loading Interface...",
"Launching Senn Hub OS..."
];

let p=0;

let i=0;

const loading=setInterval(()=>{

p++;

bar.style.width=p+"%";

if(p%20===0&&i<text.length){

status.innerHTML=text[i];

i++;

}

if(p>=100){

clearInterval(loading);

boot.style.display="none";

desktop.style.display="block";

}

},35);

function clock(){

const now=new Date();

document.getElementById("clock").innerHTML=

now.toLocaleTimeString();

}

setInterval(clock,1000);

clock();

</script>

</body>
</html>
